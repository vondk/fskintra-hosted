name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secret FLY_API_TOKEN ligger i environment 'production' (kun main)
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Fly er ikke sat op endnu
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN mangler - deploy springes over (se docs/drift.md)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FLY_API_TOKEN != ''
        with:
          submodules: recursive
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4
        if: env.FLY_API_TOKEN != ''
      - name: Deploy (én maskine)
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --ha=false
