<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% block title %}ForældreIntra til mail{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">ForældreIntra til mail</a>
  {% if tenant %}
  <nav>
    <a href="/status">Status</a>
    <a href="/settings">Indstillinger</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button type="submit" class="link">Log ud</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer><a href="/privatliv">Privatliv og sikkerhed</a></footer>
</body>
</html>
