{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<h1>Admin</h1>
{% if sent %}<p class="ok">Hvis adressen er admin, er der sendt et link.</p>{% endif %}
<form method="post" action="/admin/login">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Admin-mail <input type="email" name="email" required maxlength="254"></label>
  <button type="submit">Send login-link</button>
</form>
{% endblock %}
